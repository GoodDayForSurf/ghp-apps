<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <title>Metro Valencia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="panel" role="tabpanel" aria-labelledby="tab-angel-guimera">
    <div id="map" hidden>
      <p class="map-hint" id="map-hint">Toca una estación</p>
      <div id="map-scroll">
        <div id="plano">
          <img id="plano-img" src="plano.png" alt="Plano de Metrovalencia" draggable="false">
          <div id="plano-hits"></div>
        </div>
      </div>
    </div>
    <p class="status" id="status">Cargando…</p>
    <div id="app" hidden></div>
    <p class="meta">
      <span id="walk" hidden></span>
      <span id="fresh"></span>
    </p>
    <div class="tabs">
      <div class="dock-row">
      <div class="zoom">
        <button type="button" class="zoom-btn" id="zoom-out" aria-label="Reducir el mapa">−</button>
        <button type="button" class="zoom-btn" id="zoom-in" aria-label="Ampliar el mapa">+</button>
      </div>
      <div class="slot" role="tablist" aria-label="Estaciones">
        <button type="button" class="find" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.2 16.2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="tab" role="tab" id="tab-angel-guimera" aria-controls="panel" aria-selected="true" data-station="angel-guimera">Àngel Guimerà</button>
        <input class="query" type="search" hidden placeholder="Estación" aria-label="Nombre de la estación" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <ul class="suggest" role="listbox" hidden></ul>
      </div>
      </div>
      <table class="recent" id="recent" hidden aria-label="Últimas estaciones"></table>
    </div>
    <p id="walk-setup" class="walk-setup" hidden></p>
  </main>

  <dialog id="walk-key" class="walk-key" aria-labelledby="walk-key-title">
    <form id="walk-key-form" class="walk-key-form">
      <p id="walk-key-title" class="walk-key-title">A pie de la estación</p>
      <p class="walk-key-note">Regístrate en <a href="https://account.heigit.org/" target="_blank" rel="noopener noreferrer">account.heigit.org</a> para obtener la clave. La clave se guarda solo en este navegador.</p>
      <label class="walk-key-label" for="walk-key-input">Clave del servicio</label>
      <input id="walk-key-input" class="walk-key-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div class="walk-key-actions">
        <button type="button" class="walk-key-cancel" id="walk-key-cancel">Cancelar</button>
        <button type="submit" class="walk-key-save">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="walk.js"></script>
  <script src="app.js"></script>
</body>
</html>
