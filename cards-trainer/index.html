<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Memorize</title>
    <style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

@font-face {
    font-family: "Roboto";
    src: url("assets/fonts/Roboto-Regular.ttf") format("truetype");
}

select {
    width: 100%;
    padding: 12px 15px;
    text-align: center;
    border: none;
    color: #333;
    font-size: 3vh;
    cursor: pointer;
    transition: all 0.3s ease;
    background-color: lightblue;
    // background-color: lightpink;
}

@media screen and (orientation: portrait) {
    select {
        font-size: 5vh;
    }
}

select:focus {
    outline: none;
}

#app {
    font-family: Roboto, serif;
    display: flex;
    justify-content: start;
    flex-flow: column;
    position: fixed;
    top: var(--app-offset, 0px);
    left: 0;
    right: 0;
    width: 100%;
    height: 100vh;
    height: 100svh;
    height: var(--app-height, 100svh);
    max-height: var(--app-height, 100svh);
    overflow: hidden;
}

#buttons-container {
 margin: 24px;
}

#card {
    display: flex;
    flex-flow: column;
    align-items: stretch;
    margin: 10% 24px 0 24px;
    font-size: 4vh;
    flex: 1;
    min-height: 0;
    overflow: auto;
}

#dictionary-bar {
    flex-shrink: 0;
    margin-top: auto;
    padding-bottom: env(safe-area-inset-bottom);
}

#stats {
    display: flex;
    justify-content: start;
    gap: 16px;
    padding: 10px 16px 8px;
    color: #444;
}

#question, #answer {
    display: flex;
    flex-flow: column;
    justify-content: center;
    flex: 0;
    align-items: center;
    text-align: center;
}

#question {
    color: dimgray;
    margin-bottom: 1em;
}

comment {
    display: block;
    color: black;
    background: #a6ff4ba8;
    border-radius: 20px;
    padding: 12px;
    margin-top: 12px;
    font-size: smaller;
}

    </style>
</head>
<body>
<div id="app">
    <div id="card" class="card">
        <div id="question"></div>
        <div id="answer"></div>
    </div>
    <div id="dictionary-bar">
        <div id="stats">
            <span>Total: <span id="dict-size">0</span></span>
            <span>In queue: <span id="queue-size">0</span></span>
        </div>
        <div id="dictionaries">
            <select name="dicts" id="dictionaries-select">
                <option value="">-- Select dictionary --</option>
            </select>
        </div>
    </div>
</div>
<script type="module">
let PHRASES = [];
let NEW_PHRASES = [];

const dictionaries = [
  {
     name: "English", file: "eng.txt"
  },
   {
      name: "Spanish practice I", file: "esp-practice-1.txt"
   },
    {
      name: "Spanish basic", file: "esp-basic.txt"
   },
    {
        name: "Spanish \"Tener\"", file: "esp-tener.txt"
    },
    {
        name: "Spanish \"Dar\"", file: "esp-dar.txt"
    },
    {
        name: "Spanish \"Dar, flipar, echar de menos\"", file: "esp-dar-2.txt"
    },
   {
       name: "Spanish nouns", file: "esp-nouns.txt"
   },
   {
       name: "Spanish adjectives", file: "esp-adjectives.txt"
   },
   {
      name: "Spanish basic 2", file: "esp-basic-2.txt"
   },
    {
        name: "Spanish imperative", file: "esp-imperative.txt"
    },
    {
        name: "Spanish B1 phrases", file: "esp-b1-phrases.txt"
    },
   {
      name: "Spanish advanced", file: "esp-adv.txt"
   },
   {
      name: "Spanish common verbs", file: "esp-100verbs-yo.txt"
   },
   {
      name: "Armenian", file: "am.txt"
   }
]
const $ = selector => document.querySelector(selector);

const stages = {
    1: 7,
    2: 30,
    3: 180,
    4: 600,
    5: 3600 * 3,
    6: 3600 * 10,
    7: 3600 * 25,
    8: 3600 * 24 * 3
};

function fitAppToVisibleViewport() {
    const viewport = window.visualViewport;
    const height = viewport ? viewport.height : window.innerHeight;
    const offset = viewport ? viewport.offsetTop : 0;
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--app-height', `${Math.round(height)}px`);
    rootStyle.setProperty('--app-offset', `${Math.round(offset)}px`);
}

fitAppToVisibleViewport();
window.addEventListener('resize', fitAppToVisibleViewport);
window.addEventListener('orientationchange', fitAppToVisibleViewport);
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitAppToVisibleViewport);
    window.visualViewport.addEventListener('scroll', fitAppToVisibleViewport);
}

async function load() {
   window.addEventListener('beforeunload', () => {
      try { saveState(); } catch(e) {}
   });
   window.addEventListener('pagehide', () => {
      try { saveState(); } catch(e) {}
   });
   document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
         try { saveState(); } catch(e) {}
      }
   });
}

const STORAGE_KEY = 'langtrainer_state_v1';
const SELECTED_DICT_KEY = 'langtrainer_selected_dict';
const DICT_CONTENT_PREFIX = 'langtrainer_dict_content_v1-';

function readStorage(key) {
    try {
        return localStorage.getItem(key);
    } catch (e) {
        console.warn('Failed to read localStorage', e);
        return null;
    }
}

function writeStorage(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (e) {
        console.warn('Failed to write localStorage', e);
    }
}

function saveState() {
    if (!cardState || !(cardState.repeatQueue?.length > 1)) {
        return;
    }

    try {
        const dictionariesSelectEl = $('#dictionaries-select');
        const state = {
            dictFile: dictionariesSelectEl.value,
            cardState: cardState ? {
                question: cardState.question,
                repeatQueue: cardState.repeatQueue
            } : null
        };
        localStorage.setItem(STORAGE_KEY + '-' + dictionariesSelectEl.value, JSON.stringify(state));
    } catch (e) {
        console.warn('Failed to save state', e);
    }
}

function restoreState() {
  try {
    const dictFileName = $('#dictionaries-select').value;
    const raw = localStorage.getItem(STORAGE_KEY + '-' + dictFileName);
    NEW_PHRASES = [...PHRASES];

    cardState = new CardState();

    if (!raw) return cardState;

    const state = JSON.parse(raw);

    if (state.cardState) {
      cardState.question = state.cardState.question || '';
      cardState.answers = getAnswersForQuestion(cardState.question);
      cardState.answersForShow = 0;
      cardState.repeatQueue = Array.isArray(state.cardState.repeatQueue) ? state.cardState.repeatQueue : [];
    }
    const cleanedRepeatQueue = [];
      cardState.repeatQueue.forEach((repeatItem) => {
          const { question } = repeatItem;
          const index = NEW_PHRASES.findIndex((p) => p.startsWith(question + '\n'));

          if(PHRASES.find((p) => p.startsWith(question +'\n'))) {
              cleanedRepeatQueue.push(repeatItem)
          }

          if (index !== -1) {
              NEW_PHRASES.splice(index, 1)[0];
          }
      });


      cardState.repeatQueue = cleanedRepeatQueue;

    console.log('-----NEW_PHRASES----->', NEW_PHRASES);
    return cardState;
  } catch (e) {
    console.warn('Failed to restore state', e);
    return false;
  }
}

function randomPhrase() {
    const index = Math.round(Math.random() * (NEW_PHRASES.length - 1));
    const phrase = NEW_PHRASES.length ? NEW_PHRASES[index] : null;

    NEW_PHRASES.splice(index, 1);

    return phrase;
}

let cardState;

function getAnswersForQuestion(question) {
    const entry = PHRASES.find(text => text.startsWith(question + '\n'));

    if(!entry) {
        cardState.repeatQueue = cardState.repeatQueue.filter((item) => item.question !== question);

        return null;
    }

    return entry.split("\n").slice(1);
}

function shuffleQueue(queue) {
    return queue.reduce((res, item) => {
        if ( Math.random() > 0.5 ) {
            res.push(item);
        } else {
            res = [item].concat(res);
        }
        return res;
    }, []);
}

function getItemSecondsPeriod(item) {
    return (Date.now() - item.showTime) / 1000;
}

class CardState {

   question = '';
   answers = [];
   answersForShow = 0;
   repeatQueue = [];

   getItemFromRepeatQueue() {
       const queue = shuffleQueue(this.repeatQueue);

      let item = queue.find(item => item.stage < 9 && getItemSecondsPeriod(item) > stages[item.stage]);

       if (!item) {
           if (NEW_PHRASES.length === 0) {
               console.log('-------QUEUE END--Random from queue--->');
               let index = Math.round(queue.length * Math.random()) - 1;
               let count = 1;
               let selectedItem = queue.at(index);

               while (count < 10 ) {
                   const nextIndex = index + count;
                   const nextItem = queue.at(nextIndex < queue.length ? nextIndex : queue.length - nextIndex);

                   selectedItem = selectedItem.stage < nextItem.stage ? selectedItem : nextItem;
                   count++;
               }

               return selectedItem;
           } else {
               item = (Math.random() > 0.6 && queue.find(item => getItemSecondsPeriod(item) >= 3600 * 24 * 4));

               item && console.log('---------Random from queue--->');
           }
       }

       return item
   }

   addItemToRepeatQueue() {
      if(!this.question) return;

      let item = this.repeatQueue.find(item => item.question === this.question);

      if(!item) {
         item = {
            question: this.question,
            stage: 0,
         }

         this.repeatQueue = [item].concat(shuffleQueue(this.repeatQueue));
      }

      item.showTime = Date.now();

      if ((Date.now() - item.showTime) / 1000 > 2 * stages[item.stage]) {
         return;
      }

      item.stage++;

      console.log('------addItemToRepeatQueue---->', item);
      saveState();
      document.querySelector('#queue-size').textContent = cardState.repeatQueue.length;
   }

   getNewQuestion() {
      const repeatItem = this.getItemFromRepeatQueue();

       if (repeatItem) {
           this.question = repeatItem.question;
           this.answers = getAnswersForQuestion(this.question);
           console.log('-----item from queue----->', this.question, [repeatItem.stage, (Date.now() - repeatItem.showTime) / (1000 * (repeatItem.stage > 3 ? 60*60 : 60)), repeatItem.stage > 3 ? 'h' : 'm'])
       }

       if(!repeatItem || !this.answers) {
           const parts = randomPhrase()?.split("\n");

           if(parts) {
               this.question = parts[0] || '';
               this.answers = parts.slice(1);
               console.log('----NEW-item for queue----->',this.question);
           }

       }

      $('#question').innerText = this.question;
      $('#answer').innerText = '';

      this.answersForShow = this.answers.length;
      saveState();
   }

   showAnswer() {
      const [answer, comment] = this.answers.at(-this.answersForShow).split("//");
      $('#answer').innerHTML = `<div>${answer}</div>` + (comment ? `<comment>${comment || ''}</comment>` : '');
      this.answersForShow--;
      saveState();
   }

   next(){
      if (this.answersForShow === 0 ) {
         this.getNewQuestion();
      } else {
         this.showAnswer();

         if(this.answersForShow === 0) {
            this.addItemToRepeatQueue();
         }
      }
   }
}

function applyDictionaryText(text) {
    PHRASES = text.split(/\n\r?\n\r?/);
    document.querySelector('#dict-size').textContent = PHRASES.length;
}

function resyncPhrasesWithQueue() {
    NEW_PHRASES = [...PHRASES];

    if (!cardState) return;

    cardState.repeatQueue = cardState.repeatQueue.filter((repeatItem) => {
        const index = NEW_PHRASES.findIndex((p) => p.startsWith(repeatItem.question + '\n'));
        if (index === -1) return false;
        NEW_PHRASES.splice(index, 1);
        return true;
    });

    const entry = PHRASES.find((p) => p.startsWith(cardState.question + '\n'));
    if (entry) {
        cardState.answers = entry.split('\n').slice(1);
    }

    document.querySelector('#queue-size').textContent = cardState.repeatQueue.length;
}

function fetchDictionary(path, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(path, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

let dictionaryLoadId = 0;
let userInteracted = false;

function startTraining() {
    cardState = restoreState();
    document.querySelector('#queue-size').textContent = cardState.repeatQueue.length;
    cardState.next();
}

async function openDictionary(file) {
    if (!file) return;

    const loadId = ++dictionaryLoadId;
    userInteracted = false;

    const selectEl = $('#dictionaries-select');
    if (selectEl && selectEl.value !== file) {
        selectEl.value = file;
    }

    const cacheKey = DICT_CONTENT_PREFIX + file;
    const cached = readStorage(cacheKey);

    if (cached) {
        writeStorage(SELECTED_DICT_KEY, file);
        applyDictionaryText(cached);
        startTraining();
    }

    try {
        const resp = await fetchDictionary(file, cached ? 15000 : 20000);
        if (loadId !== dictionaryLoadId) return;
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const fresh = await resp.text();
        if (loadId !== dictionaryLoadId) return;
        if (!fresh) throw new Error('Empty dictionary');

        if (fresh !== cached) {
            writeStorage(cacheKey, fresh);
        }

        if (!cached) {
            writeStorage(SELECTED_DICT_KEY, file);
            applyDictionaryText(fresh);
            startTraining();
            return;
        }

        if (fresh === cached) return;

        applyDictionaryText(fresh);
        if (!userInteracted) {
            startTraining();
        } else {
            resyncPhrasesWithQueue();
        }
    } catch (e) {
        if (loadId !== dictionaryLoadId) return;
        if (!cached) {
            console.warn('Failed to load dictionary', e);
            const previous = readStorage(SELECTED_DICT_KEY);
            if (previous && previous !== file && readStorage(DICT_CONTENT_PREFIX + previous)) {
                if (selectEl) selectEl.value = previous;
                openDictionary(previous);
                return;
            }
            const questionEl = document.querySelector('#question');
            if (questionEl) questionEl.textContent = 'Failed to load dictionary';
            return;
        }
        console.warn('Failed to refresh dictionary, using saved copy', e);
    }
}

load().then( () => {
   const dictionariesSelectEl = $('#dictionaries-select');
   let optionsHTML = dictionariesSelectEl.innerHTML;

   dictionaries.forEach((dict) => {
      optionsHTML +=`<option value="${dict.file}">${dict.name}</option>`;
   });

   dictionariesSelectEl.innerHTML = optionsHTML;

    dictionariesSelectEl.addEventListener('change', (e) => {
        openDictionary(e.target.value);
    });

   $('#card').addEventListener('click', () => {
      userInteracted = true;
      cardState?.next();
   });
   document.addEventListener("keyup", function(event) {
      if (event.code === "Space") {
         userInteracted = true;
         cardState?.next();
      }
   });

   const savedDict = readStorage(SELECTED_DICT_KEY);
   if (savedDict && dictionaries.some((dict) => dict.file === savedDict)) {
      dictionariesSelectEl.value = savedDict;
      openDictionary(savedDict);
   }
})

if ('serviceWorker' in navigator) {
   navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.warn('Failed to register offline cache', error);
   });
}

</script>
</body>
</html>
